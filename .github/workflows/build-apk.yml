name: Build Smart Door Locker APK

on:
  workflow_dispatch:
  push:
    paths:
      - "SmartDoorLockerAndroid-LAN.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        run: |
          unzip -o SmartDoorLockerAndroid-LAN.zip
          ls -la
          ls -la SmartDoorLockerAndroid

      - name: Build APK
        working-directory: SmartDoorLockerAndroid
        run: |
          gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartDoorLocker-debug-apk
          path: SmartDoorLockerAndroid/app/build/outputs/apk/debug/app-debug.apk
